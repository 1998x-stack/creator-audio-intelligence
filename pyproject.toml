[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-audio-intelligence"
version = "0.2.0"
description = "Local-first creator video audio to timestamped insights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
cai = "creator_audio_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
