[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-audio-intelligence"
version = "0.2.0"
description = "Local-first creator video audio to timestamped insights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# av>=19 removed the `metadata_errors` kwarg that faster-whisper 1.2.x still
# passes to av.open(), so transcription died with
# "TypeError: open() got an unexpected keyword argument 'metadata_errors'".
asr = ["faster-whisper>=1.1,<2", "av>=14,<19"]
dev = ["pytest>=8,<10", "zhconv>=1.4"]

[project.scripts]
cai = "creator_audio_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
