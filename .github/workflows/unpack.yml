name: Unpack reviewed source snapshot
on:
  push:
    branches:
      - feat/complete-local-mvp
    paths:
      - '.bootstrap/*.part'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand and commit source
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part_00 || exit 0
          test -f .bootstrap/part_01 || exit 0
          test -f .bootstrap/part_02 || exit 0
          test -f .bootstrap/part_03 || exit 0
          cat .bootstrap/part_0* | base64 --decode > /tmp/cai-source.tar.xz
          echo "022859b25dd9b522809890dbf52a13ca22728f4d89d2115df028d8d7b808e2a8  /tmp/cai-source.tar.xz" | sha256sum -c -
          tar --extract --xz --file /tmp/cai-source.tar.xz --no-same-owner
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement source-linked local audio intelligence MVP'
          git push origin HEAD:feat/complete-local-mvp
